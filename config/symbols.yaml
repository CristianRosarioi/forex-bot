# Configuración por símbolo
# Spread en pips para forex; en puntos crudos de MT5 para metales e índices
#
# Sesiones (UTC, ver bot/core/scheduler.py): tokyo 0-9, london 7-16,
# new_york 12-21, overlap 12-16. La unión de las cuatro cubre 0-21 UTC
# (casi 24h de día hábil). Queda un hueco estructural 21:00-24:00 UTC
# (cierre NY / pre-Tokyo, liquidez fina y cierre del viernes) que no se
# cubre sin tocar la lógica del scheduler; se deja fuera a propósito.
# Day trading activo: los forex habilitados usan las cuatro sesiones.
symbols:
  EURUSD:
    enabled: true
    type: forex
    spread_max: 2.0
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  GBPUSD:
    enabled: true
    type: forex
    spread_max: 2.5
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  USDJPY:
    enabled: true
    type: forex
    spread_max: 3.0  # ~2-3 pips normales en demo; 2.0 rechazaba spreads normales
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  AUDUSD:
    enabled: true  # reactivado: las pérdidas venían de spread muerto y confianza baja, ya corregidos
    type: forex
    spread_max: 2.5
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  NZDUSD:
    enabled: true  # reactivado: las pérdidas venían de spread muerto y confianza baja, ya corregidos
    type: forex
    spread_max: 3.0
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  USDCAD:
    enabled: true
    type: forex
    spread_max: 3.0  # ~2-3 pips normales en demo
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  GBPJPY:
    enabled: true
    type: forex
    spread_max: 6.0  # cross volátil: spread normal 3-7 pips; 4.0 rechazaba seguido
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.3  # par volátil → menor riesgo

  EURGBP:
    enabled: true
    type: forex
    spread_max: 3.0  # cross: spread normal ~1.5-3 pips, mayor que un major
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  XAUUSD:
    # Deshabilitado: con balance ~$975 el sizing da <0.01 lots y se rechaza.
    # Para 0.01 lots con SL típico ~$7 (70 pips) haría falta ~0.72% de riesgo,
    # por encima del techo sano de 0.6%. Reactivar cuando el balance crezca lo
    # suficiente para 0.01 lots a <=0.6%. (Nota: el risk_pct por símbolo de este
    # archivo hoy NO lo usa el sizing — usa el global RISK_PCT_PER_TRADE.)
    enabled: false
    type: metal
    spread_max: 50          # el oro tiene spread mucho mayor (en puntos)
    sessions: [london, new_york, overlap]
    risk_pct: 0.3           # menor riesgo: el oro es más volátil

  US500:
    enabled: false  # activar cuando esté probado
    type: index
    spread_max: 50  # puntos
    sessions: [new_york]
    risk_pct: 0.3

  NAS100:
    enabled: false
    type: index
    spread_max: 100
    sessions: [new_york]
    risk_pct: 0.3
