# Configuración por símbolo
# Spread en pips para forex; en puntos crudos de MT5 para metales e índices
symbols:
  EURUSD:
    enabled: true
    type: forex
    spread_max: 2.0
    sessions: [london, new_york, overlap]
    risk_pct: 0.5

  GBPUSD:
    enabled: true
    type: forex
    spread_max: 2.5
    sessions: [london, new_york, overlap]
    risk_pct: 0.5

  USDJPY:
    enabled: true
    type: forex
    spread_max: 3.0  # ~2-3 pips normales en demo; 2.0 rechazaba spreads normales
    sessions: [tokyo, london, new_york, overlap]
    risk_pct: 0.5

  AUDUSD:
    enabled: true  # reactivado: las pérdidas venían de spread muerto y confianza baja, ya corregidos
    type: forex
    spread_max: 2.5
    sessions: [tokyo, london, overlap]
    risk_pct: 0.5

  NZDUSD:
    enabled: true  # reactivado: las pérdidas venían de spread muerto y confianza baja, ya corregidos
    type: forex
    spread_max: 3.0
    sessions: [tokyo, london, overlap]
    risk_pct: 0.5

  USDCAD:
    enabled: true
    type: forex
    spread_max: 3.0  # ~2-3 pips normales en demo
    sessions: [london, new_york, overlap]
    risk_pct: 0.5

  GBPJPY:
    enabled: true
    type: forex
    spread_max: 6.0  # cross volátil: spread normal 3-7 pips; 4.0 rechazaba seguido
    sessions: [tokyo, london, overlap]
    risk_pct: 0.3  # par volátil → menor riesgo

  EURGBP:
    enabled: true
    type: forex
    spread_max: 3.0  # cross: spread normal ~1.5-3 pips, mayor que un major
    sessions: [london, overlap]
    risk_pct: 0.5

  XAUUSD:
    enabled: true
    type: metal
    spread_max: 50          # el oro tiene spread mucho mayor (en puntos)
    sessions: [london, new_york, overlap]
    risk_pct: 0.3           # menor riesgo: el oro es más volátil

  US500:
    enabled: false  # activar cuando esté probado
    type: index
    spread_max: 50  # puntos
    sessions: [new_york]
    risk_pct: 0.3

  NAS100:
    enabled: false
    type: index
    spread_max: 100
    sessions: [new_york]
    risk_pct: 0.3
